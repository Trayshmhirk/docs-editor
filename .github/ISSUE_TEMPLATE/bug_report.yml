name: Bug Report
description: File a bug report to help us improve Docs Editor
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, etc.
      placeholder: "e.g., Chrome 120, Windows 11, Node 20.18"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Screenshots / Logs
      description: Add any other context, console logs, or screenshots.
    validations:
      required: false
